name: Deploy Expo Web to GitHub Pages

on:
  push:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Configure Expo base path for Pages
        run: |
          echo "EXPO_PUBLIC_PATH=/${GITHUB_REPOSITORY#*/}/" >> $GITHUB_ENV
          echo "EXPO_PUBLIC_BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV
          echo "EXPO_PUBLIC_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> $GITHUB_ENV
          echo "PUBLIC_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> $GITHUB_ENV

      - name: Install deps (Yarn)
        run: yarn install

      - name: Export web
        env:
          EXPO_PUBLIC_PATH: "${{ env.EXPO_PUBLIC_PATH }}"
          EXPO_PUBLIC_BASE_PATH: "${{ env.EXPO_PUBLIC_BASE_PATH }}"
          EXPO_PUBLIC_URL: "${{ env.EXPO_PUBLIC_URL }}"
        run: npx expo export --platform web

      - name: Prefix asset URLs for subpath
        env:
          EXPO_PUBLIC_BASE_PATH: "${{ env.EXPO_PUBLIC_BASE_PATH }}"
        run: |
          BASE_PATH="${EXPO_PUBLIC_BASE_PATH}"
          FILES=$(find dist -type f \( -name "*.html" -o -name "*.js" -o -name "*.json" -o -name "*.css" -o -name "*.txt" \))
          for f in $FILES; do
            perl -0777 -pi -e "s#(?<!${BASE_PATH})/_expo/#${BASE_PATH}/_expo/#g" "$f"
            perl -0777 -pi -e "s#(?<!${BASE_PATH})/assets/#${BASE_PATH}/assets/#g" "$f"
            perl -0777 -pi -e "s#(?<!${BASE_PATH})/node_modules/#${BASE_PATH}/node_modules/#g" "$f"
          done
          # Remove stray encoded quotes that could leak into URLs
          perl -0777 -pi -e "s|%22||g" dist/index.html

      - name: Add SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
