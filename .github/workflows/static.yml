name: Deploy Expo Web to GitHub Pages

on:
  push:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Configure Expo base path for Pages
        run: |
          echo "EXPO_PUBLIC_PATH=/${GITHUB_REPOSITORY#*/}/" >> $GITHUB_ENV
          echo "EXPO_PUBLIC_BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV
          echo "EXPO_PUBLIC_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> $GITHUB_ENV
          echo "PUBLIC_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> $GITHUB_ENV

      - name: Install deps (Yarn)
        run: yarn install

      - name: Fetch MediaPipe assets
        run: yarn fetch:mediapipe-assets

      - name: Export web
        env:
          EXPO_PUBLIC_PATH: "${{ env.EXPO_PUBLIC_PATH }}"
          EXPO_PUBLIC_BASE_PATH: "${{ env.EXPO_PUBLIC_BASE_PATH }}"
          EXPO_PUBLIC_URL: "${{ env.EXPO_PUBLIC_URL }}"
        run: npx expo export --platform web --public-url "${EXPO_PUBLIC_URL}"

      - name: Prefix asset URLs with subpath
        env:
          PREFIX: "${{ env.EXPO_PUBLIC_PATH }}"
        run: |
          FILES=$(find dist -type f \( -name "*.html" -o -name "*.js" -o -name "*.json" -o -name "*.css" -o -name "*.txt" \))
          for f in $FILES; do
            perl -0777 -pi -e "s|\"/_expo/|\"${PREFIX}_expo/|g" "$f"
            perl -0777 -pi -e "s|'/_expo/|'${PREFIX}_expo/|g" "$f"
            perl -0777 -pi -e "s|\"/assets/|\"${PREFIX}assets/|g" "$f"
            perl -0777 -pi -e "s|'assets/|'${PREFIX}assets/|g" "$f"
            perl -0777 -pi -e "s|\"/mediapipe/|\"${PREFIX}mediapipe/|g" "$f"
            perl -0777 -pi -e "s|'/mediapipe/|'${PREFIX}mediapipe/|g" "$f"
            perl -0777 -pi -e "s|\"/models/|\"${PREFIX}models/|g" "$f"
            perl -0777 -pi -e "s|'/models/|'${PREFIX}models/|g" "$f"
            perl -0777 -pi -e "s|\"/node_modules/|\"${PREFIX}node_modules/|g" "$f"
            perl -0777 -pi -e "s|'/node_modules/|'${PREFIX}node_modules/|g" "$f"
          done

      - name: Add SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - name: Inspect dist contents
        run: |
          ls -l dist/_expo/static/js/web | head -n 20 || true
          ls -l dist/mediapipe | head -n 20 || true
          ls -l dist/models | head -n 20 || true
          grep -n "/_expo/static/js/web" dist/index.html | head -n 20 || true
          grep -n "/mediapipe/" dist/index.html | head -n 20 || true

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
